arch sub lost watching the canyon. Her float is intact.`},{id:`harrow_range`,name:`The Harrow trials range`,area:`canyon`,relic:`trials_log`,hidden:!0,desc:`Three 1968 trials walkers in the silt of the canyon wall, and the range barge that ran them.`},{id:`sub_wreck`,name:`The lost submarine`,area:`plain`,relic:`boat_log`,desc:`A boat that the navy says was never there, on the slope down to the plain.`},{id:`whale_fall`,name:`Whale fall`,area:`plain`,relic:`whalebone`,desc:`A whale skeleton on the ooze, fifty years into feeding everything around it.`},{id:`thalassa`,name:`Thalassa station`,area:`plain`,relic:`thalassa_journal`,hidden:!0,desc:`The Institute's abyssal station, silent since 1994. Grandfather lives in it now.`},{id:`lander`,name:`The hadal lander`,area:`trench`,relic:`lander_core`,desc:`The Institute's unmanned lander, on a ledge two kilometres down the trench wall.`},{id:`ring`,name:`The ring`,area:`throat`,relic:`ring_stone`,desc:`Standing stones round the mouth of the Throat, older than anything on the coast.`},{id:`mooring`,name:`Abyssal mooring array`,area:`vents`,relic:`array_core`,desc:`Instruments strung up from the vent field on a two-kilometre line.`}],pt=[{id:`tern_log`,name:`The Tern's logbook`,discipline:`hydrography`,speed:.1,desc:`Soundings by a pilot who knew every metre of the channel. Hydrography works 10% faster.`},{id:`pier_bell`,name:`Ferry pier bell`,discipline:`salvage`,speed:.1,desc:`Hung over the salvage yard. The crews like it there. Salvage works 10% faster.`},{id:`repeater`,name:`Cable repeater`,discipline:`electrical`,speed:.1,desc:`Sixty years on the sea floor and it still powers up. Electrical works 10% faster.`},{id:`halcyon_notes`,name:`Halcyon field notes`,discipline:`xenology`,speed:.15,desc:`The first close observations of risers anyone made. Xenology works 15% faster.`},{id:`gullet_jaw`,name:`Old Gullet's jaw`,discipline:`rendering`,speed:.15,desc:`Hung over the rendering shed door. Rendering works 15% faster.`},{id: it.`],[`wall-half`,e=>e.wall<.5,`The breakwater is down to half. At high tide the spray comes over the yard. The crews start sleeping in their boots.`],[`trophy`,e=>Object.values(e.expeditions).some(e=>e.cleared),`A named riser, put down. The trophy goes up over the mess door. Nobody says it, but everyone is thinking that it was the old pilots' monster, and now it's the base's.`],[`surfacing`,e=>e.history.some(e=>e.target.kind===`surfacing`&&(e.outcome===`killed`||e.outcome===`tagged`)),`Another big one came up on its own and the base met it at the wall. The town has stopped asking whether the base will hold.`],[`harrow-files`,e=>!!e.projects.harrow_files,`The Harrow files arrive in a navy crate with the seals cut. In 1968 the navy walked three trials frames into the canyon off this coast, and lost all three to something the files only call the Warden. Osei reads them twice and asks for the chart of the canyon wall.`],[`harrow-rebuilt`,e=>!!e.projects.harrow_rebuild,`The yard puts a 1968 trials frame back together from what came up off the range. It stands taller than anything the base has built, with a diving helmet for a head and a harpoon winch on the shoulder. Kalinowski calls it ugly. Wren calls it the only thing anyone ever built to stop a wind-up.`],[`harrow-walks`,e=>e.frames.some(e=>e.type===`harrow`),`The first new Harrow walks out of the yard, sixty years after the last one walked into the canyon.`],[`warden`,e=>!!e.expeditions.warden?.cleared,`The Warden is down. Whatever the navy lost in 1968, the base has answered for it. The range officer's last line in the trials log, which nobody could read before, comes clear under the lamp: "If it can be stopped mid-swing, it can be stopped."`],[`tag-tracks`,e=>!!e.projects.tag_tracks,`Dr. Wren pins every tag track the base has ever recorded on one chart. None of them stop at the vents. They go down the slope, across the abyssal plain, and all of them in the same direction. "Home," Wren says, and nobody laughs.`],[`plain`,e=>(e.surveys.plain??0)>=12,`The abyssal plain is charted: four thousand metres down, and flat for a hundred kilometres. The survey launch's hydrophone picks up something walking across it on stilts.`],[`thalassa-records`,e=>!!e.projects.thalassa_records,`The Institute sends the Thalassa records with an apology. It had a station on the plain from 1988, studying the risers before anyone admitted there were any, and lost it in 1994. The last log entry is a diver's: "Grandfather is in the habitat module. We are not going back in for the plans."`],[`thalassa`,e=>!!e.expeditions.thalassa?.cleared,`Grandfather is down, and the Thalassa is open. Marine Archaeology can excavate it. Somewhere in the station are the plans the divers left behind: a walker built to go deeper than the plain.`],[`anvil-design`,e=>!!e.projects.anvil_design,`The Thalassa walker is redrawn for the yard: a titanium sphere with legs, a ceramic viewport and nowhere for anything to get a grip. The station called it the Anvil. Osei says the name can stay.`],[`anvil-walks`,e=>e.frames.some(e=>e.type===`anvil`),`The first Anvil goes into the water off the slipway and keeps going, down past where anything the base has built could follow.`],[`trench`,e=>(e.surveys.trench??0)>=14,`The hadal trench is charted, as far down as the soundings reach. Every tag track the base has ever recorded goes over the edge, and none of them come back up.`],[`convergence`,e=>!!e.projects.convergence,`Dr. Wren puts the model on the mess-room screen and nobody eats. Every riser the base has ever met was going to the same shaft in the trench floor. "Not home," Wren says. "Back. They came out of it. They are going back in."`],[`keeper`,e=>!!e.expeditions.throat?.cleared,`The Keeper is down, across the mouth of the Throat. The Anvils' lamps go over the edge of the shaft and find no bottom. Osei, on the radio from eleven kilometres down: "Commander, we'll need somewhere to live out here."`],[`station`,e=>!!e.projects.forward_station,`The forward station goes into the water at the trench's lip: thirteen phases, every discipline at the top of its trade. The base on the breakwater can run without the commander now. The Throat is waiting.`],[`all-pages`,e=>At.every(t=>e.story[t.id]),`With all five pages read, the commander has the keeper's log copied and pinned up in the mess. Under the last line someone has written: "So far."`]],Mt=e=>(e.archive?.tour??1)>=2,Nt=[[`t2-handover`,Mt,`The station logs come up sealed and numbered in the first commander's hand, with a note on the first: "Open each when the base gets back to where we were." Page one was written the day the station touched bottom: "The shaft has walls, and the walls are warm. Our lamps don't reach the far side."`],[`t2-breath`,e=>Mt(e)&&e.history.length>0,`The second page: "Day 9. The shaft breathes. Every few hours the water in it comes up past the station, warm, and things come up with it. Then it stops, and draws back, slowly." Dr. Wren reads it three times and goes to the chart room without a word.`],[`t2-cycle`,e=>Mt(e)&&!!e.projects.tag_tracks,`Dr. Wren pins the keeper's log, the Harrow files, the Thalassa records and this tour's tag tracks on one wall: 1891, 1968, 1988, now. "They aren't evenly spaced, but every one starts the same way. The fish go off the bank, the gulls leave the water, and then they come up. It breathes out and they come up. It breathes in and they go home." The station's page for the week: "The breathing is getting longer."`],[`t2-lamp`,e=>Mt(e)&&!!e.expeditions.thalassa?.cleared,`In the Thalassa's last plans is a lamp rig drawn for a shaft, with a diver's note in the margin: "Light turns the small ones. Does it turn the big one?" The keeper wrote the first half of that in 1891. The station's page for the week: "We have built a lamp. When it burns, the breathing slows."`],[`t2-watcher`,e=>Mt(e)&&!!e.projects.convergence,`The station's page: "Day 61. The lamp has burned for a month, and the breathing is the slowest it has been since we came down. Something very large has stopped at the edge of the light and stays there. It doesn't come in. It doesn't go." The next page has only a date on it.`],[`t2-beacon`,e=>Mt(e)&&!!e.expeditions.throat?.cleared,`The Keeper is down again, and the radio at the trench lip picks up a beacon coming up out of the Throat: the first forward station's, still on. The pages stopped coming up weeks ago. Osei asks for the second station to be finished first and fastest.`],[`t2-station`,e=>Mt(e)&&!!e.projects.forward_station,`The second forward station goes into the water at the trench's lip. This time nobody talks about taking it down the Throat. The Anvils are going down to fetch the first one home, and the route to the bottom is plotted (Sorties).`]],Pt=[`The Shade is down, and the Anvils' lamps find the first forward station at the bottom of the Throat with its own lamp still burning.`,`The first commander is alive, thin, and not coming up. The last log goes up in Osei's Anvil: "The shaft is quiet while the lamp burns, and someone has to tend it. The keeper kept a lamp so that a wall would hold. I can keep one here so that it doesn't have to."`,`Over the next weeks the Throat goes still. The fish come back to the bank, and the gulls come back to the water.`,`In the mess, under the keeper's last line and the "So far." someone wrote beneath it, the commander adds: "The wall held."`],Ft=`"Commander." Dr. Wren, on the radio from the trench floor, after three quiet days. The array has picked up the breathing again: slower than the Throat's, much deeper, and from the far side of the trench, nowhere near the shaft. "It isn't the only one."`;function It(e){e.story.ending||(e.endedAt=e.now,kt(e,`ending`,Pt.join(` `)))}function Lt(e){for(let[t,n,r]of jt)!e.story[t]&&n(e)&&kt(e,t,r);for(let[t,n,r]of Nt)!e.story[t]&&n(e)&&kt(e,t,r);e.story.ending&&!e.story.hook&&e.now-(e.endedAt??e.now)>=259200&&kt(e,`hook`,Ft)}var Rt=[{id:`navy`,name:`The navy`,wan     <p>Risers are coming up out of the deep water off the coast. The base on the breakwater salvages what it can, builds walking frames from it, and sends pilots out in them to meet whatever comes up the channel.</p>
    <p>The game runs whether you're watching or not. Give orders when you check in, and the base carries on while you're away.</p>
    <p class="small"><b>Keys:</b> 1 to 9 open the tabs in order, / jumps to the search box on Stores and Help, ? opens the Help page for what's on screen, and Escape closes the menu. <b>Save code</b> in the status bar backs up your base or moves it to another browser.</p>
    <ol>
      <li><b>Pick a discipline and start an action</b> on the ${U(`guide:base`,`Base`)} page. The commander works one thing at full speed.</li>
      <li><b>Salvage and smelt</b> into plate, castings and parts, then build modules (hands, launchers, plating) in Machining and Electrical.</li>
      <li><b>Fit a frame</b> in the ${U(`guide:hangar`,`Hangar`)}, give its pilot ${U(`guide:orders`,`standing orders`)}, and answer ${U(`guide:alerts`,`alerts`)} from Sorties.</li>
      <li><b>Build the base out</b> with Construction: berths for more frames, crew quarters for ${U(`guide:crews`,`work crews`)}, defences for the wall.</li>
      <li><b>Chart the water</b> with Hydrography to open patrols, wrecks to dive and ${U(`guide:expeditions`,`expeditions`)}.</li>
    </ol>
    <p>Everything in this Help tab links together. The reference pages list every item, action and riser, built from the game itself.</p>`},{id:`base`,title:`Disciplines and the commander`,body:()=>`
    <p>There are thirteen disciplines. Each levels from 1 to 99 on Melvor's curve. Every action has a level, a time, the XP it pays, and what it takes and makes. Higher actions pay better and make better things.</p>
    <p>The <b>commander</b> works one action at full speed: the <i>focus</i>. Set a <b>repeat count</b> to stop after so many, and <b>queue</b> up to five more to start in turn when the focus stops, so the base keeps working while you're away.</p>
    <p>Some actions are <b>projects</b>: done once, with a permanent effect (a berth, a sick bay, a research result). Only the commander can run a project. Moving the commander off a project part way keeps the work done so far: Resume picks it up again. <b>Build-outs</b> can be done again and again, each costing more than the last (breakwater sections, depot shelves, sealant stores).</p>
    <p><b>Rations</b> from Rendering, issued from the top bar, make all work 10% faster for an hour each, up to eight hours banked.</p>
    <p>The <b>sea</b> matters: low tide speeds up Salvage and Marine Archaeology, high tide Kelp Farming and Hydrography; storms speed Salvage and slow the kelp; at night light-shy risers come up more often.</p>`},{id:`crews`,title:`Work crews`,body:()=>`
    <p>Crew quarters (Construction) add a work crew; a mess hall, a barracks and the deep-water barracks add up to four. A crew runs a different discipline from the commander at ${zu(jr)} speed. Crews can't run projects.</p>
    <p>A crew stops when it runs out of inputs. Once the <b>foreman's office</b> is built (Construction 18), the foreman moves a crew that runs dry to the best-paying work its discipline can still do from stores instead: never a one-off project, a frame, or anything that uses up a juvenile. The status bar's crews line turns the foreman on and off.</p>
    <p>Crews make the base wide: the commander levels one discipline while the crews feed it, say Salvage and the Foundry keeping Machining in plate.</p>`},{id:`mastery`,title:`Mastery`,body:()=>`
    <p>Every repeatable action builds its own <b>mastery</b>, 1 to 99, as you do it:</p>
    <ul>${In.map(e=>`<li>Mastery ${e.level}: ${e.text}</li>`).join(``)}</ul>
    <p>Mastery also fills the discipline's <b>pool</b>. As the pool fills:</p>
    <ul>${Ln.map(e=>`<li>${zu(e.at)} full: ${e.text}</li>`).join(``)}</ul>`},{id:`alerts`,title:`Alerts, the wall and defences`,body:()=>`
    <p>Small risers probe the breakwater about every ${Bu(Sr)} (twice as often in a storm). Each one is a <b>yellow alert</b>: all work slows by ${zu(Cr)} until a frame deals with it, and risers left probing wear the <b>wall</b> down. Construction patches it.</p>
    <p>If the base goes ${Bu(wr)} without an order, a big riser climbs to the harbour: a <b>red alert</b>. Work and pilot training stop until it's dealt with. Stand down from the top bar when you'll be away for a long time; no alerts come while stood down.</p>
    <p><b>Defences</b> turn back some probing risers before they reach the wall: shark nets and floodlight towers from Construction, a minefield and a gun battery from the quartermaster.</p>
    <p>Once the base has beaten a named riser, others like it start <b>surfacing</b>: heard 36 hours out, then at the breakwater for 12 hours, wearing the wall fast, before they break through and wreck the outer yard.</p>
    <p>Answering alerts pays requisition: ${Et.yellow} for a yellow, ${Et.red} for a red, ${Et.surfacing} for a surfaced named riser.</p>`},{id:`hangar`,title:`Frames, modules and power`,body:()=>`
    <p>A <b>frame</b> is a walking machine: hull, power, hardpoints for hands and launchers, bays for passive gear. ${e.map(e=>U(`frame:${e.id}`,e.name)).join(`, `)}.</p>
    <p>A <b>module</b> goes in a hardpoint or a bay. Hardpoints are <b>hands</b> (fists, cutting hands, breaching claws and arc cutters) or <b>shoulder mounts</b> (lances, drivers, Hedgehog projectors, harpoon guns, shock nets, floodlights, tag launchers and sonar), and each frame has its own mix. Bays take passive gear: sealant for repairs, plating against damage types, reserve cells for power. Every module draws power; a fit can't draw more than the frame and pilot give.</p>
    <p>Modules can be <b>reworked</b> to Mk II, III and IV: more damage, more kits, more resist. Mk III needs a rare part off a riser, and Mk IV a rare part from the plain or the trench.</p>
    <p>Damage repairs in the hangar over time (faster with the dry dock, depot shelves and the pressure test tank).</p>`},{id:`pilots`,title:`Pilots and training`,body:()=>`
    <p>Each pilot has a trait and trains skills EVE-style: a queue of skills that trains in real time, levels I to V, each level taking much longer than the last. Skills unlock frames and modules and improve the fight: ${ur.filter(e=>[`handling`,`systems`,`weapons`,`doctrine`,`sensors`].includes(e.id)).map(e=>`${e.name} (${e.eff.toLowerCase()})`).join(`; `)}.</p>
    <p>The other skills unlock gear at level I and, as in EVE, keep paying at every level after: ${ur.filter(e=>![`handling`,`systems`,`weapons`,`doctrine`,`sensors`].includes(e.id)).map(e=>`${e.name} (${e.eff.replace(/^Level I [^;]*; /,``).toLowerCase()})`).join(`; `)}. ${ur.filter(e=>e.book).map(e=>e.name).join(` and `)} are learned from manuals Research draws up first.</p>
    <p><b>Skill plans</b> on a pilot's page queue everything a goal needs, prerequisites first: ${mr.map(e=>e.name).join(`, `)}. They show how long the rest will take.</p>
    <p><b>Implants</b>, grown by Xenology from riser tissue, go in two slots per pilot: a neural one that speeds training (${hr.filter(e=>e.slot===`neural`).map(e=>e.eff.replace(/^Trains |\.$/g,``)).join(`, `)}) and a hardwiring for the fight (${hr.filter(e=>e.slot===`hardwiring`).map(e=>e.eff.replace(/\.$/,``).toLowerCase()).join(`; `)}). Plugging in a new one destroys the old.</p>
    <p>Pilots <b>tire</b> with each fight and rest between them. Pairs who go out together build <b>bonds</b> and fight better side by side. A pilot whose frame goes down spends time in the infirmary.</p>
    <p>Every sortie earns a pilot <b>service</b>, double for a win, and service brings <b>rank</b>: ${is.map(e=>`${e.name}${e.service?` (${e.service})`:``}`).join(`, `)}. Each new rank offers a choice of two perks on the pilot's Hangar page: ${is.filter(e=>e.choice).map(e=>`${e.name.toLowerCase()}, ${e.choice.map(e=>`<b>${e.name}</b> (${e.desc.replace(/\.$/,``).toLowerCase()})`).join(` or `)}`).join(`; `)}.</p>`},{id:`orders`,title:`Standing orders`,body:()=>`
    <p>Pilots don't take orders mid-fight; they follow their <b>standing orders</b>, top to bottom, doing the first one whose condition holds and whose action is ready. Doctrine adds slots.</p>
    <p>Conditions: ${fa.map(e=>`${e.target}: ${e.text.toLowerCase()}`).join(`; `)}.</p>
    <p>Some conditions need things: wind-ups need a sonar head (or hydrophones) and Sensors I; weak points and light-shyness need the riser ${U(`guide:study`,`studied`)}.</p>
    <p>The commander can spend <b>command points</b> mid-fight: an override (do this next), the coastal battery at the breakwater, or a recall.</p>
    <p>Fights are ${U(`guide:fights`,`explained here`)}.</p>`},{id:`fights`,title:`How a fight works`,body:()=>`
    <p>Frames act on their own clocks, following orders; the riser picks a move every few seconds. Moves:</p>
    <ul><li><b>Strike</b> and <b>sweep</b>: damage one frame or all of them.</li>
      <li><b>Wind-up</b>: a big hit after a delay. Brace on it (60% off), or break it with a harpoon (the Harrow's winch, or a harpoon gun on any frame).</li>
      <li><b>Grapple</b>: holds a frame, which can only cut, brace, repair or walk away. Any shear hit makes it let go. Anvils can't be grappled.</li>
      <li><b>Weak point</b>: for a few seconds, one damage type does double or more.</li>
      <li><b>Ink</b> (Cloaks): blind frames hit for half unless they read the water (sonar or hydrophones).</li>
      <li><b>Stride</b> (Tripods, Ghosts): out of reach of hands; lances, drivers and harpoons still land, and a harpoon hauls it back.</li>
      <li><b>Drain</b> (Longlegs): a grapple that heals the riser.</li></ul>
    <p>Each riser resists some damage types and is weak to others. Light-shy ones flee enough flares. Below a share of its hull a riser may break off and escape; a harpoon pins it.</p>
    <p><b>Wear</b>: every sortie wears a frame 1% (2% if it goes down), up to 20% off its hull, until a <b>refit</b> at the dry dock clears it for plate, castings and actuators.</p>
    <p><b>Weather</b> goes out with the frames. In a storm, frames without a sonar head deal 15% less. At night, frames with neither floodlights nor sonar deal 10% less, and flares scare half as hard again. The weather works on the risers too, though less: the swell slows them 5% in a storm, and in the dark they move 5% quicker and break off half as often.</p>
    <p>A <b>breaching claw</b> cracks a riser's hide: each hit takes 6% off all its resists for 12 seconds, up to four cracks. Shelled risers that shrug off one damage type open up to everything. Research draws up the claw and the harpoon gun before Machining can build them.</p>
    <p>On a second <b>tour of duty</b> or later, Research can draw up the <b>trench weapons</b> from the forward station's logs: the <b>acid caster</b> (a fifth damage type, acid, that risers haven't adapted to; the Swallower's own gut resists it, the soft Ghost doesn't), the <b>torpedo tube</b> (one huge Shock hit every 45 seconds that runs under a striding riser) and the <b>cavitation driver</b> (Shock that breaks a grapple on any frame, even the one firing it).</p>
    <p>Later Research opens more: the <b>shock net</b> slows a riser's moves by 30% for 8 seconds; the <b>Hedgehog projector</b> lands a volley of crush and shock, but only a few times a sortie (a <b>magazine</b> bay carries more); and the <b>arc cutter</b> stuns a riser caught winding up, losing the wind-up and delaying its next move. Bays: <b>ablative plating</b> soaks the first 900 damage of a fight, a <b>coolant loop</b> speeds every recharge, and <b>ballast tanks</b> make half of grabs glance off.</p>
    <p>Outcomes: killed (salvage and a sample), tagged (part salvage, a juvenile or samples, and the Institute's thanks), driven off, broke off, lost or out of time.</p>`},{id:`study`,title:`Studying risers`,body:()=>`
    <p>Xenology studies samples (from kills, rendering, the pens) or bones from wrecks. After 5 studies a riser is understood (fewer with Comparative anatomy and the Institute). Understood, its weak point and light-shyness show, and orders can use them.</p>`},{id:`sorties`,title:`Sorties, patrols and expeditions`,body:()=>`
    <p><b>Contacts</b> are alerts at the breakwater; meet them at the wall (the coastal battery is ready) or offshore (the frames strike first).</p>
    <p><b>Patrols</b> go to a charted area and meet whatever lives there, for its salvage. Charting is Hydrography's job, and areas open in order: ${dt.map(e=>U(`area:${e.id}`,e.name)).join(` → `)}.</p>
    <p><b>Expeditions</b> are several fights in a row without coming home, ending at a named riser that drops a trophy. Damage, kits and fatigue carry from fight to fight. See ${U(`ref:expeditions`,`all expeditions`)}.</p>
    <p>Risers <b>adapt</b>: damage types used a lot in an area build up resist there, fading a little each day. Mix your damage.</p>
    <p>The hadal trench and the Throat crush anything but a pressure frame: only Anvils go.</p>`},{id:`containment`,title:`Containment and companions`,body:()=>`
    <p>Tag a small riser (or a Longlegs or Ghost) and it's followed home: a <b>juvenile</b> for the pens. Kept juveniles give samples and salvage without a fight. Containment trains them into <b>companions</b> that go out with the frames:</p>
    <ul>${Ao.map(e=>`<li>${e.name}: ${e.job}. ${S[`c_${e.id}`]?.desc??``}</li>`).join(``)}</ul>`},{id:`mainland`,title:`The mainland: requisition, contracts, factions`,body:()=>`
    <p><b>Requisition</b> is what the authority pays for the base's work. It buys stock and permanent upgrades from the quartermaster, recruits pilots, and buys defence bonds.</p>
    <p><b>Contracts</b> ask for kills, tags, surveys or deliveries, for extra pay and faction standing.</p>
    <p>Three <b>factions</b> watch what the base does: the navy (kills, alerts), the Institute (tags, studies, juveniles) and the Salvage Union (dives, deliveries). Each standing tier brings a perk.</p>
    <p>The <b>freight jetty</b> opens a surplus order in Stores: anything over the line ships out at half price as it comes in.</p>`},{id:`late`,title:`The late game and the forward station`,body:()=>`
    <p>Past the vents, the tag tracks lead across the ${U(`area:plain`,`abyssal plain`)} to the ${U(`area:trench`,`hadal trench`)} and the ${U(`area:throat`,`Throat`)}, where every riser is going. The Thalassa story line gives the plans for the ${U(`frame:anvil`,`Anvil`)}, the only frame that can go into the trench.</p>
    <p>The <b>forward station</b> is thirteen phases, one per discipline at levels 90 to 94, then commissioning at Construction 96 once the Keeper is down. Construction shows a checklist. The phases: ${x.map(e=>e.name.toLowerCase()).join(`; `)}.</p>`},{id:`tours`,title:`Tours of duty`,body:()=>`
    <p>Once the forward station is commissioned, the commander can take it down into the Throat (Records, Tours). That ends the tour: a new one starts on the breakwater with the yard empty, and the risers come up 10% more hull for each tour served.</p>
    <p>On the second tour the story goes on, and the station can't go down again until the Anvils have been down the Throat after the first one. After that, the descent is there for as many more tours as the commander wants.</p>
    <p>The pilots are the same people, so they keep their skills, training queues, implants, ranks, perks and orders. Saved order sets and fits, records, statistics and the story carry over too.</p>
    <p>The descent brings up <b>station logs</b>: one per five levels across the disciplines, ten per named riser put down, and twenty-five for the station. Logs buy lasting help from the archive: ${iu.map(e=>`<b>${e.name}</b> (${e.desc.replace(/\.$/,``).toLowerCase()})`).join(`; `)}.</p>
    <p>Every discipline earns double XP until it's back to the best level it reached on an earlier tour.</p>
    <p>From the second tour, Research can open the <b>armour yard</b>: every frame gets an armour slot (the Anvil two) for plates that each stand strongly against one kind of damage: ceramic (Crush, heavy), tendon mesh (Shear, draws power), insulated (Heat, draws power) and Faraday (Shock, heavy). A plate covers what the bay plating doesn't, so the two multiply rather than add, and no resist goes past 75%. Read what the quarry hits with (Help, the bestiary) and fit the plates to match; fit presets make the swap one click.</p>`},{id:`badges`,title:`Master's badges`,body:()=>`
    <p>Level 99 in a discipline earns its badge. The commander wears one at a time, from that discipline's page: it makes the discipline faster and adds an effect, for the commander and any crew on that work. All thirteen earn ${de.name.toLowerCase()}, which does everything at once.</p>
    <ul>${le.map(e=>`<li>${tt(e.discipline,16)} <b>${e.name}</b>: ${e.desc}</li>`).join(``)}</ul>`}],Hu=b.flatMap(e=>e.actions.map(t=>({d:e.id,a:t}))),Uu=(e={})=>Object.entries(e).map(([e,t])=>`${t} ${Wu(e)}`).join(`, `);function Wu(e){return S[e]?`<span class="help-item" data-help="item:${e}" role="link" tabindex="0">${w(e,14)}</span>`:e}var Gu=(e,t)=>`<li>${tt(e,14)} ${U(`disc:${e}`,C[e].name)} ${t.level}: <b>${t.name}</b>
  <span class="muted small">${t.time}s · ${t.xp} XP${t.project?` · once`:``}</span>${t.inputs?`<br><span class="small">Takes ${Uu(t.inputs)}</span>`:``}${t.needs?`<span class="small"> · needs ${Uu(t.needs)} kept</span>`:``}
  ${t.outputs.length?`<br><span class="small">Makes ${t.outputs.map(e=>`${e.qty} ${Wu(e.item)}${e.chance===void 0?``:` (${zu(e.chance)})`}`).join(`, `)}</span>`:``}</li>`;function Ku(e){let t=dt.filter(t=>t.risers.some(([t])=>t===e.id)),n=mt.filter(t=>t.stages.includes(e.id)),r=ne[e.like??e.id];return`<p>${e.desc}</p><p class="muted small">${e.cls}, cousin of the ${e.cousin}. ${e.hull.toLocaleString()} hull, acts every ~${e.interval}s.${e.lightShy?` Light-shy.`:``}${e.abyssal?` Lives past the vents.`:``}</p>
    <table class="help-table"><tr>${Object.keys(e.resists).map(e=>`<th>${e}</th>`).join(``)}</tr><tr>${Object.values(e.resists).map(e=>`<td>${e>=0?`${Math.round(e*100)}% resisted`:`takes +${Math.round(-e*100)}%`}</td>`).join(``)}</tr></table>
    <p class="small">Weak point: <b>${e.weakName}</b>, ${e.weakType} does ×${e.weakMult}.</p>
    <h4>Moves</h4><ul class="small">${e.moves.map(e=>`<li><b>${e.name}</b> (${e.kind}${e.dmg?`, ${e.dmg} ${e.type}`:``}${e.telegraph?`, ${e.telegraph}s wind-up`:``}${e.duration?`, ${e.duration}s`:``}${e.drain?`, heals`:``})</li>`).join(``)}</ul>

<body>
<div class="app">
  <header class="top">
    <button class="menu-btn" data-cmd="drawer" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="brand"><span id="logo" class="logo-slot"></span><span class="mark">Breakwater</span></div>
    <div id="mini" class="mini" aria-live="polite"></div>
    <div id="status" class="status" aria-live="polite"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="base">Base</button>
    <button class="tab" role="tab" data-tab="hangar">Hangar</button>
    <button class="tab" role="tab" data-tab="sorties">Sorties</button>
    <button class="tab" role="tab" data-tab="stores">Stores</button>
    <button class="tab" role="tab" data-tab="mainland">Mainland</button>
    <button class="tab" role="tab" data-tab="records">Records</button>
    <button class="tab" role="tab" data-tab="log">Log</button>
    <button class="tab" role="tab" data-tab="range">Sim range</button>
    <button class="tab" role="tab" data-tab="help">Help</button>
    <button id="page-help-tab" class="page-help" data-cmd="page-help" aria-label="Help on this page" title="Help on this page" hidden>?</button>
  </nav>
  <div id="drawer-shade" class="drawer-shade" data-cmd="drawer"></div>
  <aside id="drawer" class="drawer" aria-label="Menu"><div id="drawer-discs" class="drawer-discs"></div></aside>
  <div id="away"></div>
  <div id="coach"></div>
  <dialog id="save-dlg" class="save-dlg" aria-labelledby="save-dlg-title"></dialog>
  <dialog id="intro-dlg" class="save-dlg intro-dlg" aria-labelledby="intro-title"></dialog>
  <dialog id="settings-dlg" class="save-dlg settings-dlg" aria-labelledby="settings-title"></dialog>
  <main>
    <section id="harbour" class="harbour-wrap" aria-label="The harbour"></section>
    <section id="view-base" class="view" aria-label="Base"></section>
    <section id="view-hangar" class="view" aria-label="Hangar" hidden></section>
    <section id="view-sorties" class="view" aria-label="Sorties" hidden></section>
    <section id="view-stores" class="view" aria-label="Stores" hidden></section>
    <section id="view-mainland" class="view" aria-label="Mainland" hidden></section>
    <section id="view-records" class="view" aria-label="Records" hidden></section>
    <section id="view-log" class="view" aria-label="Log" hidden></section>
    <section id="view-help" class="view" aria-label="Help" hidden></section>
    <section id="view-range" class="view" aria-label="Sim range" hidden>
      <p class="range-note">The sim range runs fights with any frames, pilots and modules, whatever the base has built. It's for tuning.</p>
      <div id="challenge"></div>
      <div id="riser-pick" class="riser-pick" role="group" aria-label="Riser"></div>
      <div class="layout">
        <section class="setup" id="setup" aria-label="Sortie setup"></section>
        <section class="fight" aria-label="Fight">
          <div id="range-scene"></div>
          <div id="riser-panel"></div>
          <div id="frames-panel"></div>
          <div id="controls"></div>
          <ol id="log" class="log" aria-live="off"></ol>
          <div id="batch"></div>
        </section>
      </div>
    </section>
  </main>
</div>
</body>
</html>
